name: smartparking_pocket
description: "Mobile Local Parking Management & Theft Alert System for local parking attendants."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Local Offline Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4

  # On-Device Offline Optical Character Recognition
  google_mlkit_text_recognition: ^0.13.0
  camera: ^0.11.0+2

  # QR Code Generation (for 58mm receipts & digital payments)
  qr_flutter: ^4.1.0
  qr: ^3.0.1
  image: ^4.2.0

  # Bluetooth ESC/POS Thermal Printing
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: ^2.0.4

  # System Utilities & External Launchers
  url_launcher: ^6.3.0
  intl: ^0.19.0
  uuid: ^4.4.0
  vibration: ^2.0.1
  audioplayers: ^6.0.0
  shared_preferences: ^2.3.2

  # Financial Analytics Charts
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
